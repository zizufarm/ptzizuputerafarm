  <script>
    (function () {
      const WA_NUMBER = "6287774402822";

      const WA_URL =
        "https://wa.me/6287774402822?text=Halo%20PT%20ZIZU%20PUTERA%20FARM%2C%20saya%20ingin%20bertanya%20dan%20memesan%20kambing.";

      function updateWhatsAppLinks() {
        document
          .querySelectorAll('a[href*="wa.me"], a[href^="tel:"]')
          .forEach(function (a) {

            const href = a.getAttribute('href') || '';

            if (href.includes('wa.me')) {

              const oldText = href.includes('?text=')
                ? href.substring(href.indexOf('?text='))
                : '';

              a.href =
                'https://wa.me/' +
                WA_NUMBER +
                (
                  oldText ||
                  '?text=' +
                  encodeURIComponent(
                    'Halo PT ZIZU PUTERA FARM, saya ingin bertanya dan memesan kambing.'
                  )
                );

              a.target = '_blank';
              a.rel = 'noopener';

            } else if (href.startsWith('tel:')) {

              a.href = 'tel:+' + WA_NUMBER;

            }
          });
      }

      function addFloatingWA() {

        if (document.getElementById('floatingWhatsApp')) {
          return;
        }

        const a = document.createElement('a');

        a.id = 'floatingWhatsApp';
        a.href = WA_URL;
        a.target = '_blank';
        a.rel = 'noopener';

        a.innerHTML = '💬 Pesan via WhatsApp';

        a.setAttribute(
          'aria-label',
          'Pesan kambing via WhatsApp'
        );

        a.style.cssText =
          'position:fixed;' +
          'right:18px;' +
          'bottom:18px;' +
          'z-index:9999;' +
          'background:#25D366;' +
          'color:#fff;' +
          'text-decoration:none;' +
          'padding:13px 18px;' +
          'border-radius:999px;' +
          'font-weight:700;' +
          'box-shadow:0 6px 18px rgba(0,0,0,.2);' +
          'font-family:Arial,sans-serif;';

        document.body.appendChild(a);
      }

      updateWhatsAppLinks();
      addFloatingWA();

      new MutationObserver(function () {
        updateWhatsAppLinks();
        addFloatingWA();
      }).observe(document.body, {
        childList: true,
        subtree: true
      });

    })();
  </script>
