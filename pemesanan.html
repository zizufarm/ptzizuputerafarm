    <meta charset="UTF-8">

</head>

<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="navbar">
        <div class="container nav-wrap">

            <a class="logo" href="index.html">
                <img src="img/kambing1.jpg" width="14%" alt="PT Zizu Putera Farm">
                <span>PT ZIZU PUTERA FARM</span>
            </a>

        <button class="menu-toggle" type="button">
        ☰
        </button>

        <nav id="navMenu">
        <a href="index.html">BERANDA</a>
        <a class="active" href="produk.html">DAFTAR PENJUALAN KAMBING</a>

        <a href="lokasi.html">LOKASI</a>
        <a href="kontak.html">KONTAK</a>
      </nav>

        </div>
    </header>


    <!-- ==================== FORM PEMESANAN ==================== -->
    <main class="section">

        <div class="container narrow">

            <div class="page-title">
                <span class="eyebrow">FORM PEMBELI</span>

                <h2>📝 FORM PEMESANAN KAMBING</h2>

                <p>
                    Isi data berikut. Setelah dikirim, WhatsApp akan
                    terbuka otomatis.
                </p>
            </div>


            <!-- Form -->
            <form id="orderForm" class="form-card">

                <!-- Nama -->
                <label for="buyerName">
                    Nama lengkap

                    <input
                        id="buyerName"
                        type="text"
                        required
                        placeholder="Nama Anda"
                    >
                </label>


                <!-- Nomor WhatsApp -->
                <label for="buyerPhone">
                    Nomor WhatsApp

                    <input
                        id="buyerPhone"
                        type="tel"
                        required
                        placeholder="08xxxxxxxxxx"
                    >
                </label>


               

                <!-- Jumlah -->
                <label for="buyerQty">
                    Jumlah

                    <input
                        id="buyerQty"
                        type="number"
                        min="1"
                        value="1"
                        required
                    >
                </label>


                <!-- Kebutuhan -->
                <label for="buyerNeed">
                    Kebutuhan

                    <select id="buyerNeed">
                        <option value="Aqiqah">Aqiqah</option>
                        <option value="Qurban">Qurban</option>
                        <option value="Peternakan">Peternakan</option>
                        <option value="Peliharaan">Peliharaan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </label>


                <!-- Catatan -->
                <label for="buyerNote">
                    Catatan

                    <textarea
                        id="buyerNote"
                        rows="4"
                        placeholder="Contoh: ingin diantar..."
                    ></textarea>
                </label>


                <!-- Tombol -->
                <button
                    class="btn btn-primary full"
                    type="submit"
                >
                    💬 KIRIM PESANAN KAMBING VIA WHATSAPP
                </button>

            </form>

        </div>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
 <div class="copyright">@ 2025/2026<span id=""></span> PT Zizu Putera Farm</div>

    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

        initOrderForm();
    </script>

</body>

</html>
