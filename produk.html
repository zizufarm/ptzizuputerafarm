  <!-- ==================== WHATSAPP SCRIPT ==================== -->
  <script>
    (function () {

      const WA_NUMBER = "6287774402822";

      const WA_MESSAGE =
        "Halo PT ZIZU PUTERA FARM, saya ingin bertanya dan memesan kambing.";

      const WA_URL =
        "https://wa.me/" +
        WA_NUMBER +
        "?text=" +
        encodeURIComponent(WA_MESSAGE);


      /* --------------------------------
         Update semua link WhatsApp
      -------------------------------- */
      function updateWhatsAppLinks() {

        document
          .querySelectorAll('a[href*="wa.me"], a[href^="tel:"]')
          .forEach(function (link) {

            const href = link.getAttribute("href") || "";


            // Link WhatsApp
            if (href.includes("wa.me")) {

              const oldText = href.includes("?text=")
                ? href.substring(href.indexOf("?text="))
                : "";

              link.href =
                "https://wa.me/" +
                WA_NUMBER +
                (
                  oldText ||
                  "?text=" + encodeURIComponent(WA_MESSAGE)
                );

              link.target = "_blank";
              link.rel = "noopener";
            }


            // Link Telepon
            else if (href.startsWith("tel:")) {

              link.href = "tel:+" + WA_NUMBER;

            }

          });

      }


      /* --------------------------------
         Membuat tombol WhatsApp melayang
      -------------------------------- */
      function addFloatingWA() {

        // Jangan membuat tombol lebih dari satu
        if (document.getElementById("floatingWhatsApp")) {
          return;
        }


        const link = document.createElement("a");

        link.id = "floatingWhatsApp";
        link.href = WA_URL;
        link.target = "_blank";
        link.rel = "noopener";

        link.innerHTML = "💬 Pesan via WhatsApp";

        link.setAttribute(
          "aria-label",
          "Pesan kambing via WhatsApp"
        );


        // Style tombol floating
        link.style.cssText = `
          position: fixed;
          right: 18px;
          bottom: 18px;
          z-index: 9999;
          background: #25D366;
          color: #fff;
          text-decoration: none;
          padding: 13px 18px;
          border-radius: 999px;
          font-weight: 700;
          box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
          font-family: Arial, sans-serif;
        `;


        document.body.appendChild(link);

      }


      /* --------------------------------
         Jalankan fungsi
      -------------------------------- */
      updateWhatsAppLinks();
      addFloatingWA();


      /* --------------------------------
         Pantau perubahan pada halaman
      -------------------------------- */
      const observer = new MutationObserver(function () {

        updateWhatsAppLinks();
        addFloatingWA();

      });


      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

    })();
  </script>
